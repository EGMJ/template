name: Technical Task
description: Internal engineering work (refactoring, infra, tech debt)
title: "[Tech]: "
labels: ["tech-debt"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done and why?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What files, modules, or systems are affected?

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How do we know this is done?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: Estimated Effort
      options:
        - Small (< 1 day)
        - Medium (1-3 days)
        - Large (3-5 days)
        - Extra Large (> 1 week)
