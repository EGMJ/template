# When a PR is merged into develop:
# 1. Calculate next semver from conventional commits
# 2. Create git tag (v1.2.3)
# 3. Create branch release/v1.2.3 from develop
# 4. Auto-create PR from release/v1.2.3 → main
name: Promote to Release

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  contents: write

jobs:
  promote:
    name: Tag + Release Branch + PR to main
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.head.ref, 'release/')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Calculate next version and create tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          pre_release_branches: develop
          tag_prefix: v

      - name: Create release branch
        run: |
          VERSION="${{ steps.tag.outputs.new_tag }}"
          echo "Creating branch release/${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/${VERSION}"
          git push origin "release/${VERSION}"

      - name: Create PR to main
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          VERSION="${{ steps.tag.outputs.new_tag }}"
          CHANGELOG="${{ steps.tag.outputs.changelog }}"

          gh pr create \
            --title "release: ${VERSION}" \
            --body "$(cat <<EOF
          ## Release ${VERSION}

          Auto-created from \`develop\` after merging PR #${{ github.event.pull_request.number }}.

          ### Changes
          ${CHANGELOG}

          ### QA Checklist
          - [ ] Functional tests passed
          - [ ] Regression tests passed
          - [ ] Edge cases verified
          - [ ] Approved for production
          EOF
          )" \
            --base main \
            --head "release/${VERSION}"
          echo "Created PR: release/${VERSION} → main"
