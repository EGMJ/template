# Auto-create a draft PR when a branch is pushed for the first time
name: Auto PR

on:
  push:
    branches:
      - "feature/*"
      - "feature/**"
      - "feat/*"
      - "feat/**"
      - "fix/*"
      - "fix/**"
      - "hotfix/*"
      - "hotfix/**"
      - "chore/*"
      - "chore/**"
      - "docs/*"
      - "docs/**"
      - "refactor/*"
      - "refactor/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    name: Create Pull Request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine base branch
        id: base
        run: |
          # If 'develop' branch exists remotely, use it; otherwise use default branch
          if git ls-remote --heads origin develop | grep -q develop; then
            echo "branch=develop" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ github.event.repository.default_branch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft PR
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          BASE="${{ steps.base.outputs.branch }}"

          # Skip if a PR already exists for this branch
          EXISTING=$(gh pr list --head "$BRANCH" --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "PR already exists for $BRANCH — skipping"
            exit 0
          fi

          # Build title from branch name: feature/add-login → feat: add login
          TYPE=$(echo "$BRANCH" | cut -d'/' -f1)
          # Normalize type aliases
          case "$TYPE" in
            feature) TYPE="feat" ;;
          esac
          DESCRIPTION=$(echo "$BRANCH" | sed 's|^[^/]*/||' | tr '-' ' ' | tr '_' ' ')
          TITLE="${TYPE}: ${DESCRIPTION}"

          gh pr create \
            --title "$TITLE" \
            --body "## Summary

          <!-- Describe what this PR does -->

          ---
          _Auto-generated draft PR for branch \`${BRANCH}\`_" \
            --base "$BASE" \
            --head "$BRANCH" \
            --draft

          echo "Created draft PR: $TITLE ($BRANCH → $BASE)"
