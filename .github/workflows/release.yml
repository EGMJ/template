# Release workflow — runs when develop is merged into main
# 1. Calculates the next semantic version from conventional commits
# 2. Creates a git tag (v1.2.3)
# 3. Creates a GitHub Release with auto-generated release notes
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag-and-release:
    name: Tag & GitHub Release
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.merged == true &&
      (
        startsWith(github.event.pull_request.head.ref, 'release/') ||
        startsWith(github.event.pull_request.head.ref, 'hotfix/')
      )
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: latest
        run: |
          TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$TAG" ]; then
            TAG="v0.0.0"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Latest tag: $TAG"

      - name: Calculate next version
        id: version
        run: |
          CURRENT="${{ steps.latest.outputs.tag }}"
          MAJOR=$(echo "$CURRENT" | sed 's/^v//' | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | sed 's/^v//' | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | sed 's/^v//' | cut -d. -f3)

          # Check commit messages since last tag for version bump type
          if [ "$CURRENT" = "v0.0.0" ]; then
            COMMITS=$(git log --oneline --format="%s")
          else
            COMMITS=$(git log "${CURRENT}..HEAD" --oneline --format="%s")
          fi

          if echo "$COMMITS" | grep -qiE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE'; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            echo "bump=major" >> "$GITHUB_OUTPUT"
          elif echo "$COMMITS" | grep -qiE '^feat(\(.+\))?:'; then
            MINOR=$((MINOR + 1))
            PATCH=0
            echo "bump=minor" >> "$GITHUB_OUTPUT"
          else
            PATCH=$((PATCH + 1))
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          fi

          NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT (${MAJOR}.${MINOR}.${PATCH})"

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PREVIOUS="${{ steps.latest.outputs.tag }}"

          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --latest
          echo "Created release $VERSION"
