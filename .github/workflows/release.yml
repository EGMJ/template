# Automated releases with Release Please
# Gera changelogs, bumps de versão e GitHub Releases automaticamente
# baseado em Conventional Commits
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Create Release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: node
          # Para Python: release-type: python
          # Para Go: release-type: go
          # Para genérico: release-type: simple

