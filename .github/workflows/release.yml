# Creates a GitHub Release when a PR from release/v* or hotfix/*
# is merged into main. The tag already exists (created on develop).
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.merged == true &&
      (
        startsWith(github.event.pull_request.head.ref, 'release/v') ||
        startsWith(github.event.pull_request.head.ref, 'hotfix/')
      )
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from branch
        id: version
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"

          if [[ "$BRANCH" == release/v* ]]; then
            # release/v1.2.3 → v1.2.3
            TAG="${BRANCH#release/}"
          else
            # hotfix/* → get latest tag to create new patch
            echo "Hotfix branch — tag will be created"
            TAG=""
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create tag for hotfix (if needed)
        if: startsWith(github.event.pull_request.head.ref, 'hotfix/')
        id: hotfix-tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

      - name: Determine final tag
        id: final
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ steps.hotfix-tag.outputs.new_tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.final.outputs.tag }}"

          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --latest
          echo "Created GitHub Release: $TAG"
