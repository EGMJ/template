# Continuous Integration - runs on every push and pull request
# Adapte os jobs abaixo para o runtime do seu projeto (Node, Python, Go, etc.)
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
